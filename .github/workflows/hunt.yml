name: hunt

# Asks every 15 minutes and gets far less. Over the first 13.5 hours on this
# schedule GitHub fired it 5 times, not 54: scheduled runs on a public repo
# are best-effort and are dropped wholesale under load. A tighter cron does
# not buy more runs, so the fix is on the other axis - when a run does start,
# it hunts for most of an hour instead of eight minutes, and it publishes
# while it goes rather than once at the end.
# Note GitHub disables scheduled workflows on a public repo after 60 days
# with no activity - this one commits on most runs, which keeps it alive.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Wall-clock budget for the hunt"
        default: "50"
      bench:
        description: "Measure this runner's rate limits instead of hunting"
        type: boolean
        default: false

# Never let two runs commit the same file at once. Runs are long now, so a
# scheduled fire arriving mid-run waits; GitHub keeps at most one pending per
# group and discards the rest, so this cannot pile up.
concurrency:
  group: hunt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    # Comfortably past hunt.py's own hard stop at 1.6x the budget (80 min at
    # --minutes 50), so the script always stops itself before the job is
    # killed from outside.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Roblox sits behind Cloudflare and GitHub runners are datacenter IPs,
      # which can be throttled harder than a home connection. This says what
      # this runner actually gets, rather than assuming.
      - name: Bench the runner
        if: inputs.bench
        run: python bench.py --headers --batch --duration 10

      - name: Hunt, publishing as it goes
        if: ${{ !inputs.bench }}
        run: |
          set -uo pipefail
          git config user.name  "rovalid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            # The hunt keeps writing docs/hits.json while this runs. A write
            # landing inside the pull below can leave a rebase half-applied,
            # and every later publish in the run would then fail on a repo
            # stuck mid-rebase - 50 minutes of findings lost to a state
            # nothing clears until the next job checks out fresh.
            git rebase --abort 2>/dev/null || true
            git add docs/hits.json
            # Most cycles turn up nothing, and an empty commit every two
            # minutes would bury the history for no gain.
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -q -m "hunt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Somebody may have pushed to the branch while we were hunting.
            for i in 1 2 3; do
              git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
            # A failed push is not fatal: the hunt is still running and the
            # next cycle carries the same findings plus whatever came since.
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed, retrying next cycle"
          }

          # The hunt runs in the background so this shell can commit while it
          # is still going. Without that the board would sit frozen for the
          # whole run and then jump an hour in one commit, which is the
          # opposite of something worth watching. The marker file carries the
          # exit status out of the subshell - polling with `kill -0` would
          # not work, since a finished child stays visible as a zombie until
          # it is waited on.
          done_marker="$RUNNER_TEMP/hunt.done"
          rm -f "$done_marker"
          (
            python hunt.py --minutes "${{ inputs.minutes || 50 }}" \
                           --lengths 3,4,5 --out docs/hits.json
            echo $? > "$done_marker"
          ) &

          while [ ! -f "$done_marker" ]; do
            sleep 120
            publish
          done

          publish
          exit "$(cat "$done_marker")"
